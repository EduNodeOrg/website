# netlify.toml
[build]
  command = "npm install --legacy-peer-deps && npm run build"
  functions = "netlify/functions"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"
  GENERATE_SOURCEMAP = "false"

[functions]
  node_bundler = "esbuild"

